name: CI/CD Pipeline - AEMUD Frontend (Angular)

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deploy target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # 1. Linting & Code Quality Analysis
  # ============================================================================
  lint-and-quality:
    name: 🔍 ESLint & Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Run ESLint
        run: |
          npm run lint || true

  # ============================================================================
  # 2. Automated Unit Tests & Code Coverage
  # ============================================================================
  tests-and-coverage:
    name: 🧪 Angular Karma Unit Tests (ChromeHeadless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Run Karma Tests with Code Coverage
        run: |
          npm run test:ci -- --code-coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-coverage-report
          path: coverage/
          retention-days: 14

  # ============================================================================
  # 3. Production Build & Bundle Inspection
  # ============================================================================
  build-production:
    name: 🏗️ Production Build & Optimization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Compile Angular Production Artifact
        run: |
          npm run build:prod

      - name: Upload Production Dist Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: dist/amued-frontend/
          retention-days: 7

  # ============================================================================
  # 4. Security & Vulnerability Scanning (Trivy)
  # ============================================================================
  security-scan:
    name: 🛡️ Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 5. Multi-Stage Docker Build & Push (Nginx Container)
  # ============================================================================
  docker-build-push:
    name: 🐳 Docker Build & Push (GHCR)
    needs: [lint-and-quality, tests-and-coverage, build-production, security-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 6. Continuous Deployment - Staging
  # ============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stage.aemud.org
    steps:
      - name: Deploy to Staging Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            echo "=== [STAGING] Starting Deployment of AEMUD Frontend ==="
            cd /opt/aemud/staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker-compose pull aemud-frontend
            docker-compose up -d --remove-orphans aemud-frontend
            echo "=== Validating Frontend Healthcheck ==="
            timeout 30s bash -c 'until curl -sSf http://localhost:80; do sleep 3; done' || exit 1
            echo "=== [STAGING] Frontend Deployment Success ==="

  # ============================================================================
  # 7. Continuous Deployment - Production
  # ============================================================================
  deploy-production:
    name: 🌟 Deploy to Production
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aemud.org
    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            echo "=== [PRODUCTION] Starting Zero-Downtime Deployment of AEMUD Frontend ==="
            cd /opt/aemud/production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker-compose pull aemud-frontend
            docker-compose up -d --no-deps aemud-frontend
            echo "=== Validating Production Frontend Healthcheck ==="
            timeout 30s bash -c 'until curl -sSf http://localhost:80; do sleep 3; done' || exit 1
            echo "=== [PRODUCTION] Frontend Deployment Completed Successfully ==="
