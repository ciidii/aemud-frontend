name: CI/CD Pipeline - AEMUD Frontend (Angular)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # 1. Linting & Code Quality Analysis
  # ============================================================================
  lint-and-quality:
    name: 🔍 ESLint & Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Run ESLint
        run: |
          npm run lint || true

  # ============================================================================
  # 2. Automated Unit Tests & Code Coverage
  # ============================================================================
  tests-and-coverage:
    name: 🧪 Angular Karma Unit Tests (ChromeHeadless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Run Karma Tests with Code Coverage
        run: |
          npm run test:ci -- --code-coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-coverage-report
          path: coverage/
          retention-days: 14

  # ============================================================================
  # 3. Production Build & Bundle Inspection
  # ============================================================================
  build-production:
    name: 🏗️ Production Build & Optimization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Compile Angular Production Artifact
        run: |
          npm run build:prod

      - name: Upload Production Dist Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: dist/amued-frontend/
          retention-days: 7

  # ============================================================================
  # 4. Security & Vulnerability Scanning (Trivy)
  # ============================================================================
  security-scan:
    name: 🛡️ Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 5. Multi-Stage Docker Build & Push (Nginx Container)
  # ============================================================================
  docker-build-push:
    name: 🐳 Docker Build & Push (GHCR)
    needs: [lint-and-quality, tests-and-coverage, build-production, security-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 6. Continuous Deployment - Single Server
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Server
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            echo "=================================================="
            echo "🌐 [DEPLOY] Starting AEMUD Frontend Deployment"
            echo "=================================================="
            DEPLOY_DIR="/opt/aemud/app"
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"
            
            # Authentification GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Téléchargement et redémarrage du conteneur Frontend Nginx
            docker compose -f docker-compose.prod.yml pull aemud-frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps aemud-frontend
            
            # Vérification de disponibilité HTTP
            echo "⏳ Validation du Healthcheck Frontend..."
            timeout 30s bash -c 'until curl -sSf http://localhost:80; do sleep 3; done' || {
              echo "❌ Frontend check failed!"
              exit 1
            }
            
            docker image prune -f
            echo "✅ Déploiement du Frontend terminé avec succès !"
