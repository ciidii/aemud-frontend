<div class="mb-3 dynamic-field-container" [formGroup]="formGroup">
  
  <!-- Label & Badges -->
  <div class="d-flex justify-content-between align-items-center mb-1">
    <label [for]="field.key" class="form-label mb-0 fw-semibold">
      {{ field.label }}
      <span *ngIf="field.isRequired" class="text-danger">*</span>
    </label>
    <span *ngIf="field.category === 'CUSTOM'" class="badge bg-info-subtle text-info border border-info-subtle small-badge">
      Personnalisé
    </span>
  </div>

  <!-- 1. TEXT -->
  <ng-container *ngIf="field.type === 'TEXT'">
    <input
      type="text"
      class="form-control"
      [id]="field.key"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      [class.is-invalid]="isInvalid"
    />
  </ng-container>

  <!-- 2. TEXTAREA -->
  <ng-container *ngIf="field.type === 'TEXTAREA'">
    <textarea
      class="form-control"
      [id]="field.key"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      rows="3"
      [class.is-invalid]="isInvalid"
    ></textarea>
  </ng-container>

  <!-- 3. NUMBER -->
  <ng-container *ngIf="field.type === 'NUMBER'">
    <input
      type="number"
      class="form-control"
      [id]="field.key"
      [formControlName]="field.key"
      [placeholder]="field.placeholder || ''"
      [min]="field.validation?.min ?? null"
      [max]="field.validation?.max ?? null"
      [class.is-invalid]="isInvalid"
    />
  </ng-container>

  <!-- 4. DATE -->
  <ng-container *ngIf="field.type === 'DATE'">
    <input
      type="date"
      class="form-control"
      [id]="field.key"
      [formControlName]="field.key"
      [class.is-invalid]="isInvalid"
    />
  </ng-container>

  <!-- 5. SELECT -->
  <ng-container *ngIf="field.type === 'SELECT'">
    <select
      class="form-select"
      [id]="field.key"
      [formControlName]="field.key"
      [class.is-invalid]="isInvalid"
    >
      <option value="" disabled selected>-- Sélectionnez une option --</option>
      <option *ngFor="let opt of field.options" [value]="opt">
        {{ opt }}
      </option>
    </select>
  </ng-container>

  <!-- 6. BOOLEAN (Switch) -->
  <ng-container *ngIf="field.type === 'BOOLEAN'">
    <div class="form-check form-switch mt-2">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        [id]="field.key"
        [formControlName]="field.key"
        [class.is-invalid]="isInvalid"
      />
      <label class="form-check-label text-muted" [for]="field.key">
        {{ control.value ? 'Oui' : 'Non' }}
      </label>
    </div>
  </ng-container>

  <!-- 7. RADIO -->
  <ng-container *ngIf="field.type === 'RADIO'">
    <div class="d-flex flex-wrap gap-3 mt-1">
      <div *ngFor="let opt of field.options; let i = index" class="form-check">
        <input
          class="form-check-input"
          type="radio"
          [id]="field.key + '_' + i"
          [name]="field.key"
          [value]="opt"
          [formControlName]="field.key"
          [class.is-invalid]="isInvalid"
        />
        <label class="form-check-label" [for]="field.key + '_' + i">
          {{ opt }}
        </label>
      </div>
    </div>
  </ng-container>

  <!-- 8. MULTI_SELECT (Checkboxes with badges) -->
  <ng-container *ngIf="field.type === 'MULTI_SELECT'">
    <div class="card p-2 bg-light-subtle border mt-1">
      <div class="d-flex flex-column gap-2">
        <div *ngFor="let opt of field.options; let i = index" class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="field.key + '_multi_' + i"
            [checked]="isMultiSelectOptionSelected(opt)"
            (change)="toggleMultiSelectOption(opt, $event)"
          />
          <label class="form-check-label" [for]="field.key + '_multi_' + i">
            {{ opt }}
          </label>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Validation Error Feedback -->
  <div *ngIf="isInvalid" class="invalid-feedback d-block mt-1 animate-fade-in">
    <i class="bi bi-exclamation-circle me-1"></i> {{ errorMessage }}
  </div>
</div>
