<div class="filters-container">
  <div class="search-and-actions-bar">
    <!-- 1. Search Box -->
    <div class="search-box">
      <i class="bi bi-search search-icon"></i>
      <input type="text"
             class="search-input"
             placeholder="Rechercher (nom, prénom, téléphone, email, école...)"
             [(ngModel)]="searchTerm"
             (keyup.enter)="applySearchTerm()">
      <button *ngIf="searchTerm"
              (click)="clearSearchTerm()"
              type="button"
              class="btn-clear-search"
              title="Effacer la recherche">
        <i class="bi bi-x-circle-fill"></i>
      </button>
      <button (click)="applySearchTerm()"
              type="button"
              class="btn-search-trigger">
        Rechercher
      </button>
    </div>

    <!-- 2. Quick Filter: Statut de Paiement / Cotisation -->
    <div class="quick-filter-select-wrapper" [class.has-selection]="!!selectedPaymentStatus">
      <i class="bi bi-cash-stack quick-filter-icon"></i>
      <select class="quick-filter-select"
              [ngModel]="selectedPaymentStatus"
              (ngModelChange)="onQuickPaymentStatusChange($event)">
        <option value="">Cotisation : Toutes</option>
        <option value="PAID">✓ À jour (Payé)</option>
        <option value="PENDING">⏳ En attente</option>
      </select>
      <i class="bi bi-chevron-down select-chevron"></i>
    </div>

    <!-- 3. Quick Filter: Statut de Dossier / Inscription -->
    <div class="quick-filter-select-wrapper" [class.has-selection]="!!selectedRegistrationStatus">
      <i class="bi bi-file-earmark-check quick-filter-icon"></i>
      <select class="quick-filter-select"
              [ngModel]="selectedRegistrationStatus"
              (ngModelChange)="onQuickRegistrationStatusChange($event)">
        <option [ngValue]="null">Dossier : Tous</option>
        <option value="COMPLETED">🟢 Complété</option>
        <option value="UNCOMPLETED">🟠 Incomplet</option>
        <option value="EXPIRED">🔴 Expiré</option>
      </select>
      <i class="bi bi-chevron-down select-chevron"></i>
    </div>

    <!-- 4. Filter Panel Toggle Button -->
    <button (click)="openFilterPanel.emit()"
            [class.active]="filtersActive"
            type="button"
            class="btn-filter-drawer"
            title="Ouvrir les filtres avancés (Clubs, Commissions, Bourses, Mandats)">
      <i class="bi bi-sliders2"></i>
      <span class="d-none d-lg-inline">Filtres Avancés</span>
      <span *ngIf="activeFilterCount > 0" class="filter-count-badge">{{ activeFilterCount }}</span>
    </button>
  </div>

  <!-- Active Filter Chips Row -->
  <div *ngIf="activeChips.length > 0" class="active-chips-row">
    <span class="chips-label">Filtres actifs :</span>
    <div class="chips-list">
      <span *ngFor="let chip of activeChips" class="filter-chip">
        <span class="chip-text">{{ chip.label }}</span>
        <button (click)="removeChip(chip)" type="button" class="btn-remove-chip" title="Retirer ce filtre">
          <i class="bi bi-x"></i>
        </button>
      </span>
      <button (click)="clearAllFilters()" type="button" class="btn-clear-all-chips">
        <i class="bi bi-arrow-counterclockwise"></i> Tout réinitialiser
      </button>
    </div>
  </div>
</div>
