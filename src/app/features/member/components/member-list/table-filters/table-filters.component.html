<div class="filters-container">
  <!-- 0. Fast Segmented Status Tabs -->
  <div class="segmented-status-tabs">
    <button type="button" class="tab-btn" [class.active]="selectedMemberStatus === null && !selectedPaymentStatus" (click)="onQuickMemberStatusChange(null)">
      <i class="bi bi-people-fill"></i>
      <span>Tous les Adhérents</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedMemberStatus === 'ACTIVE'" (click)="onQuickMemberStatusChange('ACTIVE')">
      <i class="bi bi-mortarboard-fill text-teal"></i>
      <span>Étudiants Actifs</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedMemberStatus === 'ALUMNI'" (click)="onQuickMemberStatusChange('ALUMNI')">
      <i class="bi bi-award-fill text-emerald"></i>
      <span>Réseau Alumni</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedPaymentStatus === 'PENDING'" (click)="onQuickPaymentStatusChange(selectedPaymentStatus === 'PENDING' ? '' : 'PENDING')">
      <i class="bi bi-hourglass-split text-warning"></i>
      <span>Cotisations en Attente</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedMemberStatus === 'INACTIVE'" (click)="onQuickMemberStatusChange('INACTIVE')">
      <i class="bi bi-pause-circle-fill text-muted"></i>
      <span>Inactifs / À Régulariser</span>
    </button>
  </div>

  <!-- 1. Search Bar & Action Controls -->
  <div class="search-and-actions-bar">
    <!-- Search Box -->
    <div class="search-box">
      <i class="bi bi-search search-icon"></i>
      <input type="text"
             class="search-input"
             placeholder="Recherche instantanée (nom, prénom, téléphone, email, école, matricule...)"
             [(ngModel)]="searchTerm"
             (ngModelChange)="onSearchInput($event)"
             (keyup.enter)="applySearchTerm()">
      <button *ngIf="searchTerm"
              (click)="clearSearchTerm()"
              type="button"
              class="btn-clear-search"
              title="Effacer la recherche">
        <i class="bi bi-x-circle-fill"></i>
      </button>
    </div>

    <!-- Filter Panel Toggle Button -->
    <button (click)="openFilterPanel.emit()"
            [class.active]="filtersActive"
            type="button"
            class="btn-filter-drawer"
            title="Ouvrir les filtres avancés (Clubs, Commissions, Bourses, Mandats)">
      <i class="bi bi-sliders2"></i>
      <span class="d-none d-sm-inline">Filtres Avancés</span>
      <span *ngIf="activeFilterCount > 0" class="filter-count-badge">{{ activeFilterCount }}</span>
    </button>
  </div>

  <!-- Active Filter Chips Row -->
  <div *ngIf="activeChips.length > 0" class="active-chips-row">
    <span class="chips-label">Filtres actifs :</span>
    <div class="chips-list">
      <span *ngFor="let chip of activeChips" class="filter-chip">
        <span class="chip-text">{{ chip.label }}</span>
        <button (click)="removeChip(chip)" type="button" class="btn-remove-chip" title="Retirer ce filtre">
          <i class="bi bi-x"></i>
        </button>
      </span>
      <button (click)="clearAllFilters()" type="button" class="btn-clear-all-chips">
        <i class="bi bi-arrow-counterclockwise"></i> Tout réinitialiser
      </button>
    </div>
  </div>
</div>
