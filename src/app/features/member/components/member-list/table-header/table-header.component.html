<div class="header-container">
  <div class="top-row">
    <div class="left-section">
      <div class="title-with-badge">
        <h1 class="page-title">Répertoire des Membres</h1>
        <span class="count-badge" *ngIf="(totalItems$ | async) !== null">
          <i class="bi bi-people-fill"></i>
          {{ totalItems$ | async }} membre{{ ((totalItems$ | async) || 0) > 1 ? 's' : '' }}
        </span>
      </div>
      <p class="page-subtitle">Gestion centralisée des adhérents, étudiants actifs et anciens de l'AEMUD.</p>
    </div>

    <div class="right-section">
      <button (click)="exportTriggered.emit()" class="btn-action btn-secondary" title="Exporter la sélection ou l'ensemble des membres">
        <i class="bi bi-file-earmark-arrow-down"></i>
        <span>Exporter</span>
      </button>
      <button (click)="onAddMember()" class="btn-action btn-primary" title="Inscrire un nouveau membre">
        <i class="bi bi-person-plus-fill"></i>
        <span>Nouveau Membre</span>
      </button>
    </div>
  </div>
</div>
