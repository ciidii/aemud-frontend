<div class="member-list-page">
  <div class="list-header">
    <div *ngIf="isSmsSelectMode" class="sms-mode-banner" role="alert">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-chat-dots-fill banner-icon"></i>
          <div>
            <strong>Mode sélection SMS activé</strong>
            <div class="small text-muted">Sélectionnez les membres à contacter, puis cliquez sur "Valider pour la campagne SMS".</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button type="button"
                  class="btn btn-teal-primary btn-sm"
                  [disabled]="!(hasSelection$ | async)"
                  (click)="useSelectionForSms()">
            <i class="bi bi-people-fill"></i> Utiliser la sélection ({{ selectedMembersCount$ | async }})
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" routerLink="/notifications/sms">
            Quitter le mode SMS
          </button>
        </div>
      </div>
    </div>

    <app-table-header (exportTriggered)="toggleExportModal()"></app-table-header>
    <app-table-filters (openFilterPanel)="toggleFilterPanel()"></app-table-filters>
  </div>

  <div class="list-body">
    <app-table-body
      [loading]="loading$ | async"
      [members]="members$ | async"
      (singleDelete)="handleSingleDelete($event)">
    </app-table-body>
  </div>

  <div class="list-footer">
    <app-table-footer
      (deleteTriggered)="toggleDeleteModal()"
      (exportTriggered)="toggleExportModal()"
      (sendMessageTriggered)="toggleSendMessageModal()"
      [isSmsSelectMode]="isSmsSelectMode"
      (useSelectionForSms)="useSelectionForSms()">
    </app-table-footer>
  </div>
</div>

<app-export-modal
  (close)="toggleExportModal()"
  *ngIf="isExportModalOpen"
  [searchRequest]="searchParamsForExport$ | async">
</app-export-modal>

<app-send-message-modal
  *ngIf="isSendMessageModalOpen"
  [recipientNumbers]="recipientNumbers"
  (close)="toggleSendMessageModal()">
</app-send-message-modal>

<app-filter-panel
  (applyFilters)="applyFilters($event)"
  (close)="toggleFilterPanel()"
  (resetFilters)="resetFilters()"
  [isOpen]="isFilterPanelOpen">
</app-filter-panel>

<app-confirm-delete-modal
  (close)="toggleDeleteModal()"
  (confirm)="onDeleteConfirmed()"
  *ngIf="isDeleteModalOpen"
  [itemCount]="memberToDelete ? 1 : ((selectedMembersCount$ | async) || 0)">
</app-confirm-delete-modal>
