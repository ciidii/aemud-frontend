<div class="member-add-page-container p-4">
  
  <!-- Header & Back navigation -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <a [routerLink]="['/members/list-members']" class="text-decoration-none text-muted mb-2 d-inline-flex align-items-center back-link">
        <i class="bi bi-arrow-left me-2"></i> Retour à la liste des membres
      </a>
      <h2 class="fw-bold mb-1 page-title">Inscription d'un Nouveau Membre</h2>
      <p class="text-muted mb-0 page-subtitle">
        Renseignez les informations de l'adhérent. Le formulaire s'adapte automatiquement selon sa situation (étudiant ou diplômé).
      </p>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5 bg-white rounded-4 border shadow-sm">
    <div class="spinner-border text-teal" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Chargement du formulaire...</span>
    </div>
    <p class="text-muted mt-3" style="font-size: 1.4rem;">Chargement du formulaire dynamique...</p>
  </div>

  <!-- Dynamic Form Container -->
  <div *ngIf="!isLoading && schema" class="row justify-content-center">
    <div class="col-xl-9 col-lg-10 col-12">
      <app-dynamic-form
        [schema]="schema"
        [submitButtonText]="'Enregistrer et inscrire le membre'"
        [isSubmitting]="isSubmitting"
        (formSubmit)="onFormSubmit($event)"
      ></app-dynamic-form>
    </div>
  </div>

</div>
