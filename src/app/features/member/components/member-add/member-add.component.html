<div class="member-add-page-container">
  
  <!-- Header & Back navigation -->
  <div class="page-top-bar d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <a [routerLink]="['/members/list-members']" class="back-nav-btn mb-2 d-inline-flex align-items-center">
        <i class="bi bi-arrow-left me-2"></i> Retour au répertoire des membres
      </a>
      <h2 class="page-title mb-1">Inscription d'un Nouveau Membre</h2>
      <p class="page-subtitle mb-0">
        Renseignez la fiche d'adhésion. Le formulaire s'adapte dynamiquement selon la catégorie choisie (Étudiant ou Alumni).
      </p>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5 bg-white rounded-4 border shadow-sm loading-card">
    <div class="spinner-border text-teal" style="width: 3.2rem; height: 3.2rem;" role="status">
      <span class="visually-hidden">Chargement du formulaire...</span>
    </div>
    <p class="text-muted mt-3 mb-0" style="font-size: 1.4rem;">Chargement du formulaire dynamique...</p>
  </div>

  <!-- Dynamic Form Container -->
  <div *ngIf="!isLoading && schema" class="row justify-content-center">
    <div class="col-xl-9 col-lg-10 col-12">
      <app-dynamic-form
        [schema]="schema"
        [submitButtonText]="'Enregistrer et inscrire le membre'"
        [isSubmitting]="isSubmitting"
        (formSubmit)="onFormSubmit($event)"
      ></app-dynamic-form>
    </div>
  </div>

</div>
